<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Diamonds</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
    body{background:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
    .box{background:#fff;padding:40px;border-radius:24px;max-width:500px;width:100%;border:1px solid #f1f5f9;}
    .box h2{text-align:center;margin-bottom:8px;}
    .box p{text-align:center;color:#64748b;margin-bottom:24px;}
    .card{background:#f8fafc;padding:20px;border-radius:16px;border:1px solid #e2e8f0;margin:12px 0;text-align:center;cursor:pointer;transition:0.3s;}
    .card:hover{border-color:#e94560;transform:scale(1.02);}
    .card h3{font-size:24px;color:#0f172a;}
    .card p{color:#64748b;font-size:14px;}
  </style>
</head>
<body>
<div class="box">
  <h2>💎 Select Diamonds</h2>
  <p>Choose your reward package</p>
  <div class="card" onclick="selectDiamonds(1000)"><h3>1000 💎</h3><p>Free</p></div>
  <div class="card" onclick="selectDiamonds(5000)"><h3>5000 💎</h3><p>Free</p></div>
  <div class="card" onclick="selectDiamonds(10000)"><h3>10000 💎</h3><p>Free</p></div>
</div>
<script>
  function selectDiamonds(amount) {
    localStorage.setItem('diamonds', amount);
    window.location.href = '/game-id.html';
  }
</script>
</body>
</html>
